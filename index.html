<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MechCraft 3D - 웹 기반 기계 설계</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 왼쪽 사이드바: 도구 및 부품 버튼 -->
    <div id="sidebar">
        <h2>MechCraft 3D</h2>
        <div class="panel">
            <h3>기본 구조</h3>
            <button id="btn-cube">+ 육면체 추가</button>
            <button id="btn-cylinder">+ 원기둥 추가</button>
        </div>
        <div class="panel">
            <h3>기계 요소</h3>
            <button id="btn-spring">+ 스프링 추가</button>
            <button id="btn-motor">+ 모터 추가</button>
        </div>
        <div class="panel">
            <h3>관리</h3>
            <button id="btn-clear" class="danger">모두 지우기</button>
        </div>
    </div>

    <!-- 3D 화면이 렌더링 될 영역 -->
    <div id="canvas-container"></div>

    <!-- Three.js 및 OrbitControls 라이브러리 로드 (ES Modules 방식) -->
    <script async src="https://unpkg.com/es-module-shims@1.6.3/dist/es-module-shims.js"></script>
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.150.1/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.150.1/examples/jsm/"
        }
      }
    </script>
    
    <!-- 메인 스크립트 연결 -->
    <script type="module" src="script.js"></script>
</body>
</html>
